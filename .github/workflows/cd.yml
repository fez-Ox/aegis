name: Aegis CD (Continuous Deployment)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-modal-backend:
    name: Deploy Modal Serverless API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Deploy FastAPI Gateway to Modal
        if: env.MODAL_TOKEN_ID != '' && env.MODAL_TOKEN_SECRET != ''
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          uv run modal deploy src/aegis/remote/api.py

      - name: Report Deployment Status
        if: env.MODAL_TOKEN_ID == '' || env.MODAL_TOKEN_SECRET == ''
        run: |
          echo "Modal credentials not configured in repository secrets; skipping live modal deploy."

  build-release-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android Platform Support
        working-directory: apps/mobile
        run: flutter create --platforms=android --org com.aegis .

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: Archive Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-mobile-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

      - name: Publish Release APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-mid1
          name: Aegis v0.1.0-mid1 (FYP-1 Mid Supervisory Release)
          files: apps/mobile/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
        continue-on-error: true
