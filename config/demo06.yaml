# Modal-first Aegis geometry configuration for Demo06-Self.
# Water bottle placement in classroom/hall.

storage:
  data_volume: aegis-poc-data
  model_cache_volume: aegis-model-cache
  data_mount: /data
  model_mount: /models

video:
  filename: video.mp4
  sample_fps: 15
  width: 960
  height: 540

camera:
  calibration_filename: calib.txt
  calibration_mode: self_calibrated
  intrinsics: null
  intrinsics_resolution: null
  allow_approximate: false
  self_calibration_weights_filename: droidcalib.pth
  self_calibration_weights_url: https://raw.githubusercontent.com/boschresearch/DroidCalib/main/droidcalib.pth
  self_calibration_camera_model: pinhole
  self_calibration_stride: 1
  self_calibration_max_frames: 0
  self_calibration_width: 517
  self_calibration_height: 384

depth:
  model_id: depth-anything/Depth-Anything-V2-Metric-Indoor-Small-hf
  mode: metric
  batch_size: 2
  fp16: true

pose:
  weights_filename: droid.pth
  weights_url: https://drive.google.com/uc?id=1PpqVt1H4maBa_GbPJp4NwxRsd9jk-elh
  stride: 1
  buffer: 512
  filter_thresh: 2.4
  beta: 0.3
  frontend_thresh: 16.0
  frontend_window: 25
  frontend_radius: 2
  frontend_nms: 1
  backend_thresh: 22.0
  backend_radius: 2
  backend_nms: 3
  asynchronous: false

vggt:
  model_id: facebook/VGGT-Omega
  image_size: 518
  keyframe_stride: 6
  batch_size: 1
  dtype: bfloat16

sam2:
  model_id: facebook/sam2-hiera-large
  prompt_confidence_threshold: 0.30
  multimask_output: false

perception:
  detector_model: yolov8m-worldv2.pt
  target_classes:
    - water bottle
    - bottle
    - desk
    - table
    - podium
    - lectern
    - laptop
    - cell phone
    - phone
  confidence_threshold: 0.35
  iou_threshold: 0.45
  min_points_in_box: 20
  track_max_gap: 3
  track_smoothing: 0.65

geometry:
  max_points_per_frame: 5000
  max_total_points: 150000
  depth_min: 0.1
  depth_max: 20.0
  depth_scale: 1.0
  pose_scale: 1.0

visualization:
  log_video: true
  video_stride: 1
  point_radius: 0.01
  camera_radius: 0.04
