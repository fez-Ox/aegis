# Aegis vocabulary: the single source of truth for detector prompts, label
# roles, query synonyms and grammar. Every other label list is generated from
# this file (see src/aegis/core/vocabulary.py).
#
# Fields
#   id               canonical label (lower case, single spaces, unique)
#   display          human label used in names such as "Shoes #1"
#   prompts          text prompts sent to the open-vocabulary detector;
#                    each prompt belongs to exactly one entry
#   synonyms         extra words accepted in user queries only
#   role             object | anchor | landmark | hand
#                    - object:   a personal item that gets a memory
#                    - anchor:   furniture an object can be in/on/under/next to
#                    - landmark: room evidence only, never an anchor or object
#                    - hand:     the wearer's hands (pick-up cues)
#   plural           grammar: "are" instead of "is"
#   importance       normal | high (high = kept in detail longer)
#   max_extent       largest plausible box dimension (scale units); null = none
#   room_type        this entry votes for the room type
#   container        anchors only: objects can be "inside"
#   support_surface  anchors only: objects can rest "on" it
#   open_underneath  anchors only: objects can be "under" it

version: 1
entries:
  # --------------------------------------------------------------- anchors
  - id: storage cabinet
    display: Storage Cabinet
    prompts: [storage cabinet, cabinet, cupboard, shelf]
    role: anchor
    container: true
    support_surface: true
    max_extent: 4.5
