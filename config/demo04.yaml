# Demo04: Empty The Trash
# Run with: uv run modal run run_pipeline.py --config-path config/demo04.yaml --dataset-id demo04 --stage all

storage:
  data_volume: aegis-poc-data
  model_cache_volume: aegis-model-cache
  data_mount: /data
  model_mount: /models

video:
  filename: video.mp4
  sample_fps: 15
  width: 960
  height: 540

camera:
  calibration_filename: calib.txt
  calibration_mode: self_calibrated
  allow_approximate: false
  self_calibration_weights_filename: droidcalib.pth
  self_calibration_weights_url: https://raw.githubusercontent.com/boschresearch/DroidCalib/main/droidcalib.pth
  self_calibration_camera_model: pinhole
  self_calibration_stride: 1
  self_calibration_max_frames: 0
  self_calibration_width: 517
  self_calibration_height: 384

vggt:
  model_id: facebook/VGGT-Omega
  image_size: 518
  keyframe_stride: 6
  batch_size: 1
  dtype: bfloat16

sam2:
  model_id: facebook/sam2-hiera-large
  prompt_confidence_threshold: 0.30
  multimask_output: true

perception:
  # Direct masks from YOLOE are refined by SAM2 box prompts in the worker.
  detector_backend: yoloe
  detector_model: yoloe-11l-seg.pt
  target_classes:
    - trash can
    - trash bin
    - garbage bag
    - rubbish
    - paper
    - cardboard box
    - plastic bottle
    - food container
    - hand
    - human hand
  confidence_threshold: 0.35
  iou_threshold: 0.45
  min_points_in_box: 20
  track_max_gap: 5
  reid_max_gap: 30
  reid_appearance_threshold: 0.35
  track_smoothing: 0.60
  hand_contact_iou_threshold: 0.10
  hand_contact_max_distance: 0.35

visualization:
  log_video: true
  video_stride: 1
  point_radius: 0.01
  camera_radius: 0.04
