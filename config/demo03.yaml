storage:
  data_volume: aegis-poc-data
  model_cache_volume: aegis-model-cache
  data_mount: /data
  model_mount: /models

video:
  filename: video.mp4
  sample_fps: 15
  width: 960
  height: 540

camera:
  calibration_filename: calib.txt
  calibration_mode: provided
  intrinsics: null
  intrinsics_resolution: null
  allow_approximate: false

vggt:
  model_id: facebook/VGGT-Omega
  image_size: 512
  keyframe_stride: 15
  dtype: bfloat16

sam2:
  model_id: facebook/sam2-hiera-large
  prompt_confidence_threshold: 0.35
  multimask_output: false

perception:
  detector_backend: yoloe
  detector_model: yoloe-11l-seg.pt
  target_classes:
    - refrigerator
    - fridge
    - cooking pot
    - pot
    - bowl
    - basket
    - food container
    - kitchen counter
    - sink
  confidence_threshold: 0.40
  iou_threshold: 0.45
  min_points_in_box: 25
  track_max_gap: 3
  reid_max_gap: 30
  reid_appearance_threshold: 0.35
  track_smoothing: 0.65

visualization:
  log_video: true
  video_stride: 1
  point_radius: 0.01
  camera_radius: 0.04
